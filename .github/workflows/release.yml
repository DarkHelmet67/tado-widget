name: Release

# Push a tag like v2.0 to build the APK, store it in versions/ and publish a GitHub release.
# With the signing secrets set (docs/releasing.md) it builds a signed release APK and AAB;
# without them it falls back to a debug-signed APK so the pipeline still works.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.TADO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TADO_KEYSTORE_BASE64 }}
          TADO_KEYSTORE_PASSWORD: ${{ secrets.TADO_KEYSTORE_PASSWORD }}
          TADO_KEY_ALIAS: ${{ secrets.TADO_KEY_ALIAS }}
          TADO_KEY_PASSWORD: ${{ secrets.TADO_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export TADO_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew testDebugUnitTest assembleRelease bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/tado-widget-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/tado-widget-${GITHUB_REF_NAME#v}.aab"

      - name: Build debug APK (no signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          ./gradlew testDebugUnitTest assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/tado-widget-${GITHUB_REF_NAME#v}-debug.apk"

      - name: Store APK in versions/ on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p versions
          cp dist/*.apk versions/
          git add versions
          git commit -m "Add ${GITHUB_REF_NAME} APK to versions/" || echo "nothing to commit"
          git push origin main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
