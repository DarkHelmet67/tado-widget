name: Release

# Push a tag like v2.0.0 to build a signed APK + AAB and attach them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TADO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          TADO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TADO_KEYSTORE_PASSWORD: ${{ secrets.TADO_KEYSTORE_PASSWORD }}
          TADO_KEY_ALIAS: ${{ secrets.TADO_KEY_ALIAS }}
          TADO_KEY_PASSWORD: ${{ secrets.TADO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
