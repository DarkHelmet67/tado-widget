plugins {
    id 'com.android.application'
}

android {
    namespace 'it.darkhelmet67.tado'
    compileSdk 35

    defaultConfig {
        applicationId 'it.darkhelmet67.tado'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '2.0.2'
    }

    // Release signing comes from the environment (see docs/releasing.md); never commit keys.
    signingConfigs {
        release {
            def keystorePath = System.getenv('TADO_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('TADO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TADO_KEY_ALIAS')
                keyPassword System.getenv('TADO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('TADO_KEYSTORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
